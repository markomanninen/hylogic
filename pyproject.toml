[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hylogic"
version = "1.0.0"
description = "Propositional and first-order logic in Hy: truth tables, arguments, models and a resolution prover"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marko Manninen", email = "elonmedia@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["hy>=1.0"]
keywords = ["hylang", "lisp", "logic", "propositional logic", "first-order logic", "truth table", "theorem prover", "resolution", "unification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Lisp",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# check-with-z3 hands large or hard problems to the Z3 solver
z3 = ["z3-solver"]

[project.urls]
Homepage = "https://github.com/markomanninen/hylogic"

[tool.setuptools]
packages = ["hylogic"]

[tool.setuptools.package-data]
hylogic = ["*.hy"]

[tool.pytest.ini_options]
testpaths = ["test"]
# .hy test modules can't go through pytest's assertion rewriting
addopts = "--assert=plain -p no:cacheprovider"
